name: Build & Distribute to Firebase

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Optimized Release APK
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName="1.0.${{ github.run_number }}" --no-daemon

      - name: Upload APK artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: moneycheck-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Generate Release Notes
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s%n%n%b" | head -c 500)
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG="Bản phát hành Moneycheck #${{ github.run_number }}"
          fi
          echo "$COMMIT_MSG" > release-notes.txt
          echo "Generated release notes:"
          cat release-notes.txt

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "Deploying using FIREBASE_TOKEN..."
            firebase appdistribution:distribute app/build/outputs/apk/release/app-release.apk \
              --app "$FIREBASE_APP_ID" \
              --token "$FIREBASE_TOKEN" \
              --testers "plda140997@gmail.com" \
              --release-notes-file release-notes.txt || \
            firebase appdistribution:distribute app/build/outputs/apk/release/app-release.apk \
              --app "$FIREBASE_APP_ID" \
              --token "$FIREBASE_TOKEN" \
              --release-notes-file release-notes.txt
          else
            echo "Deploying using Service Account JSON..."
            echo "$FIREBASE_CREDENTIALS" > service-account.json
            export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/service-account.json"
            firebase appdistribution:distribute app/build/outputs/apk/release/app-release.apk \
              --app "$FIREBASE_APP_ID" \
              --testers "plda140997@gmail.com" \
              --release-notes-file release-notes.txt || \
            firebase appdistribution:distribute app/build/outputs/apk/release/app-release.apk \
              --app "$FIREBASE_APP_ID" \
              --release-notes-file release-notes.txt
            rm -f service-account.json
          fi
