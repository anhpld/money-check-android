name: Build & Distribute to Firebase

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: moneycheck-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "Deploying using FIREBASE_TOKEN..."
            firebase appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk \
              --app "$FIREBASE_APP_ID" \
              --token "$FIREBASE_TOKEN" \
              --groups testers \
              --release-notes "Cập nhật trợ lý AI với SQL tool calling và giao diện Lovable" || \
            firebase appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk \
              --app "$FIREBASE_APP_ID" \
              --token "$FIREBASE_TOKEN" \
              --release-notes "Cập nhật trợ lý AI với SQL tool calling và giao diện Lovable"
          else
            echo "Deploying using Service Account JSON..."
            echo "$FIREBASE_CREDENTIALS" > service-account.json
            export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/service-account.json"
            firebase appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk \
              --app "$FIREBASE_APP_ID" \
              --testers "plda140997@gmail.com" \
              --release-notes "Cập nhật trợ lý AI với SQL tool calling và giao diện Lovable" || \
            firebase appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk \
              --app "$FIREBASE_APP_ID" \
              --release-notes "Cập nhật trợ lý AI với SQL tool calling và giao diện Lovable"
            rm -f service-account.json
          fi
